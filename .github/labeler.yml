# actions/labeler の設定（.github/workflows/labeler.yml から使う）
# リリース先とタイトルの prefix によるラベルはワークフロー側で付ける

# リポジトリの設定・開発ツールの変更
repository:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.githooks/**'
          - 'scripts/git-hooks/**'
          - 'scripts/setup-hooks.js'
          - '.coderabbit.yaml'
          - '.gitattributes'
          - '.gitignore'
          - '.nvmrc'
          - '.prettierrc.json'
          - '.prettierignore'
          - 'eslint.config.js'
          - 'tsconfig.json'
