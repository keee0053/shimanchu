# pre-push フックと同じチェックを GitHub 上で実行する
name: CI

on:
  pull_request:
    branches: [develop, main]
    # edited: PR タイトルだけを変更したときもタイトルの検査を再実行する
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 品質チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # コミットメッセージの検査に履歴が必要

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: PR タイトル
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/git-hooks/check-commit-message.js --title "$PR_TITLE"

      - name: ブランチ名
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/git-hooks/check-branch-name.js "$HEAD_REF" "$BASE_REF"

      - name: コミットメッセージ（PR）
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/git-hooks/check-commits.js "$BASE_SHA" "$HEAD_SHA"

      # develop / main に直接入ったコミット（フックを通っていないもの）も検査する
      # ブランチ新規作成時（before が 0000...）は比較元がないためスキップする
      - name: コミットメッセージ（push）
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: node scripts/git-hooks/check-commits.js "$BEFORE_SHA" "$AFTER_SHA"

      - name: 型チェック
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: 整形チェック
        run: npm run format:check
